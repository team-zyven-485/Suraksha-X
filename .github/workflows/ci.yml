name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: API end-to-end tests (in-memory database)
        env:
          PORT: 3100
          NODE_ENV: production
          ADMIN_ACCESS_CODE: ci-admin-code
          RESCUE_ACCESS_CODE: ci-rescue-code
          SESSION_SECRET: ci-session-secret-ci-session-secret-1234
        run: |
          node dist/server.cjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break; sleep 1; done
          npm run test:api

  satellite-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Import check
        working-directory: backend
        run: python -c "import app.main"
